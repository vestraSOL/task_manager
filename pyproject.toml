[tool.ruff]
target-version='py314'
line-length=88
exclude=['alembic']
[tool.ruff.lint]
select=['E','F','I']
[tool.ruff.format]
quote-style='double'
indent-style="space"
skip-magic-trailing-comma=false
line-ending='auto'
[tool.mypy]
files=["app"]
python_version="3.14"
check_untyped_defs=true
show_error_codes=true
warn_unused_ignores=true
ignore_missing_imports=true
